name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - name: PyInstaller
        shell: msys2 {0}
        env:
          UCRT64_PREFIX: C:/msys64/ucrt64
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm evelina.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/evelina -DestinationPath evelina-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: evelina-windows
          path: evelina-windows.zip
